<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar eclipses · calculator</title>
<meta name="description" data-i18n="app_tagline" data-i18n-attr="content"
      content="Local circumstances of every solar eclipse from 2026 to 2050, computed from JPL DE440s ephemerides.">
<link rel="stylesheet" href="vendor/leaflet-1.9.4.css">
<link rel="stylesheet" href="css/style.css">
<script>
  // The theme is applied before the first paint, or whoever asked for the dark
  // one gets a flash of the light one in the face. With no stored choice the
  // operating system decides, which is what someone who configured it expects.
  try {
    const c = localStorage.getItem('tema') || 'auto';
    document.documentElement.dataset.theme = c === 'auto'
      ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : c;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-box">
    <h1 data-i18n="gate_h">Before using this</h1>
    <p data-i18n="gate_p1"></p>
    <p data-i18n="gate_p2"></p>
    <p data-i18n="gate_p3"></p>
    <button id="gate-ok" data-i18n="gate_ok">Read and understood</button>
  </div>
</div>

<header>
  <h1><span data-i18n="app_title">Solar eclipses</span> <span class="range">2026 – 2050</span></h1>
  <nav class="modes">
    <button class="mode active" data-mode="eclipse" data-i18n="mode_eclipse">By eclipse</button>
    <button class="mode" data-mode="lugar" data-i18n="mode_place">By place</button>
    <a class="mode" href="stabilise.html" data-i18n="nav_stabiliser">Stabiliser</a>
  </nav>
  <select id="lang" data-i18n="aria_lang" data-i18n-attr="aria-label" aria-label="Language"></select>
  <select id="basemap" data-i18n="aria_base" data-i18n-attr="aria-label" aria-label="Base map">
    <option value="streets" data-i18n="base_streets">Map: streets</option>
    <option value="relief" data-i18n="base_relief">Map: relief</option>
    <option value="plain" data-i18n="base_plain">Map: coastlines only</option>
  </select>
  <select id="theme" data-i18n="aria_theme" data-i18n-attr="aria-label" aria-label="Colour theme">
    <option value="auto" data-i18n="theme_auto">Theme: automatic</option>
    <option value="light" data-i18n="theme_light">Theme: light</option>
    <option value="dark" data-i18n="theme_dark">Theme: dark</option>
    <option value="a11y" data-i18n="theme_a11y">Theme: accessible</option>
  </select>
</header>

<div id="layout">
  <aside id="panel">
    <section id="ctl-eclipse">
      <label for="pick" data-i18n="label_eclipse">Eclipse</label>
      <select id="pick"></select>
      <div id="summary" class="summary"></div>
      <p class="hint" data-i18n="hint_mark"></p>
    </section>

    <section id="ctl-lugar" hidden>
      <label data-i18n="label_coords">Coordinates</label>
      <div class="coords">
        <input id="in-lat" type="number" step="0.0001"
               data-i18n="ph_lat" data-i18n-attr="placeholder" placeholder="latitude">
        <input id="in-lon" type="number" step="0.0001"
               data-i18n="ph_lon" data-i18n-attr="placeholder" placeholder="longitude">
      </div>
      <div class="row">
        <button id="go" data-i18n="btn_compute">Compute</button>
        <button id="geo" class="ghost" data-i18n="btn_locate">My location</button>
      </div>
      <p class="hint" data-i18n="hint_place"></p>
    </section>

    <div id="result"></div>
  </aside>
  <main id="map"></main>
</div>

<footer data-i18n="footer_main"></footer>

<script src="vendor/leaflet-1.9.4.js"></script>
<script src="js/lang.js"></script>
<script src="js/besselian.js"></script>
<script src="js/radiometry.js"></script>
<script src="js/terrain.js"></script>
<script src="js/app.js"></script>
</body>
</html>
