<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar video stabiliser</title>
<meta name="description" data-i18n="st_tagline" data-i18n-attr="content"
      content="Pins the eclipsed Sun to a fixed point of the frame, in the browser, without uploading the video anywhere.">
<link rel="stylesheet" href="css/style.css">
<script>
  try {
    const c = localStorage.getItem('tema') || 'auto';
    document.documentElement.dataset.theme = c === 'auto'
      ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : c;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
</head>
<body>

<header>
  <h1 data-i18n="st_title">Solar video stabiliser</h1>
  <nav class="modes">
    <a class="mode" href="index.html" data-i18n="nav_calculator">Eclipse calculator</a>
  </nav>
  <select id="lang" data-i18n="aria_lang" data-i18n-attr="aria-label" aria-label="Language"></select>
</header>

<main class="page">
  <p class="lead" data-i18n="st_why"></p>
  <p class="lead" data-i18n="st_privacy"></p>

  <div id="drop" class="drop">
    <p data-i18n="st_drop">Drop a video here, or</p>
    <input type="file" id="file" accept="video/*">
  </div>

  <section id="work" hidden>
    <p class="sub" id="name"></p>
    <div class="vids">
      <div>
        <label data-i18n="st_original">Original</label>
        <video id="src" playsinline muted controls></video>
      </div>
      <div>
        <label data-i18n="st_tracking">Tracking</label>
        <canvas id="preview"></canvas>
      </div>
    </div>

    <div class="row">
      <button id="go" data-i18n="st_go">Stabilise</button>
      <label class="check"><input type="checkbox" id="full">
        <span data-i18n="st_keep_frame">Keep the whole frame</span></label>
      <button id="again" class="ghost" data-i18n="st_another">Another video</button>
    </div>
    <p class="hint" data-i18n="st_crop_hint"></p>

    <p class="hint" id="status">—</p>
    <progress id="bar" max="1" value="0" hidden></progress>

    <div id="out-box" hidden>
      <label data-i18n="st_result">Result</label>
      <video id="out" controls playsinline></video>
      <p class="row"><a id="dl" class="ghost" href="#" download data-i18n="st_save">Save the video</a></p>
      <div class="assume"><b data-i18n="st_out_h">What comes out and what does not.</b>
        <span data-i18n="st_out"></span></div>
    </div>
  </section>

  <div class="assume"><b data-i18n="st_how_h">How it works.</b> <span data-i18n="st_how"></span></div>
</main>

<footer>
  <span data-i18n="st_footer"></span> ·
  <a href="../LICENSES.md">AGPL-3.0 / CC BY-SA 4.0</a>
</footer>

<script src="js/lang.js"></script>
<script src="js/stabilise.js"></script>
<script src="js/stabilise-ui.js"></script>
</body>
</html>
